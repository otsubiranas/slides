<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Français</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #84cbc9;
            font-family: Arial, sans-serif;
            color: #000;
        }

        header {
            height: 90px;
            background: white;
            display: flex;
            align-items: center;
            padding: 15px 30px;
            border-bottom: 3px solid black;
        }

        header img {
            height: 60px;
            width: 60px;
            object-fit: contain;
        }

        header h1 {
            margin: 0 0 0 15px;
            font-size: 28px;
            text-transform: uppercase;
        }

        main {
            width: 100%;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .slides {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: white;
            border: 4px solid black;
            box-shadow: 10px 10px 0 black;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        @media (max-width: 600px) {
            header {
                height: 70px;
            }

            header img {
                height: 45px;
                width: 45px;
            }

            header h1 {
                font-size: 22px;
            }

            main {
                margin-top: 25px;
            }

            .slides {
                box-shadow: 5px 5px 0 black;
            }
        }
    </style>
</head>

<body>

    <header>
        <img src="logo.png" alt="Logo">
        <h1>Français</h1>
    </header>

    <main>
        <div class="slides">
            <iframe src="<iframe src="<iframe src="https://docs.google.com/presentation/d/e/2PACX-1vQwM-bz6ePY50_tHMj9X8dBmp_Ucz8cqEoegiDfk15CYsNBsgNIZsXnxJGQH4dcBWLyMSVQsf59KRBz/pubembed?start=false&loop=false&delayms=3000" frameborder="0" width="960" height="569" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true">"
            </iframe>
        </div>
    </main>

</body>
</html>
